# OpenTelemetry Collector (otelcol-contrib), run natively by `python -m sim.run up` from the repo root.
#
# metrics -> Prometheus exporter on :8889 (scraped by Prometheus)
# traces, logs -> OTLP JSON lines under var/telemetry/ (read by the OpsPilot ingest from M3 on)

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 2s
  # SDK identity attributes would otherwise become labels on every metric series.
  resource/strip_sdk:
    attributes:
      - {key: telemetry.sdk.name, action: delete}
      - {key: telemetry.sdk.language, action: delete}
      - {key: telemetry.sdk.version, action: delete}

exporters:
  prometheus:
    endpoint: 127.0.0.1:8889
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 2m
  file/traces:
    path: var/telemetry/traces.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 3
  file/logs:
    path: var/telemetry/logs.jsonl
    rotation:
      max_megabytes: 100
      max_backups: 3

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [resource/strip_sdk, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
